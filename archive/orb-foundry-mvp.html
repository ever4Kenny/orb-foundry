<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orb Foundry MVP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0a; display:flex; justify-content:center; align-items:center;
  min-height:100vh; overflow:hidden; font-family:monospace;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#gc { position:relative; width:360px; height:640px; max-width:100vw; max-height:100vh; }
canvas { display:block; width:100%; height:100%; background:#111; }
#hui { position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; }
#tui { padding:6px 10px; display:flex; justify-content:space-between; color:#ccc; font-size:12px; background:rgba(0,0,0,0.6); }
#ri { color:#ffcc00; }
#sd { color:#fff; font-size:17px; font-weight:bold; }
#bui { padding:3px 10px; color:#aaa; font-size:10px; display:flex; gap:6px; flex-wrap:wrap; }
.bd { width:9px; height:9px; border-radius:50%; display:inline-block; }
#sel, #upg {
  position:absolute; bottom:60px; left:8px; right:8px;
  background:rgba(20,20,20,0.95); border:1px solid #444;
  border-radius:8px; padding:14px; pointer-events:auto; display:none;
}
#sel h2, #upg h2 { font-size:13px; text-align:center; margin-bottom:10px; }
#sel h2 { color:#ffcc00; } #upg h2 { color:#ff6600; }
#sopts, #uopts { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.bo, .uo {
  background:#1a1a1a; border:2px solid #333; border-radius:8px;
  text-align:center; cursor:pointer; color:#ddd; transition:border-color .15s;
}
.bo { width:75px; padding:8px 5px; font-size:10px; }
.bo:hover, .bo:active { border-color:#ffcc00; }
.bo .ic { width:26px; height:26px; border-radius:50%; margin:0 auto 5px; }
.bo .nm { font-weight:bold; margin-bottom:2px; }
.bo .ds { font-size:9px; color:#999; }
.uo { width:135px; padding:10px 6px; font-size:11px; }
.uo:hover, .uo:active { border-color:#ff6600; }
.uo .nm { font-weight:bold; color:#ff9933; margin-bottom:4px; }
.uo .ds { font-size:9px; color:#999; line-height:1.3; }
#ro {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.88); display:none; flex-direction:column;
  justify-content:center; align-items:center; pointer-events:auto;
}
#ro h1 { color:#ffcc00; font-size:22px; margin-bottom:8px; }
#ro .scr { color:#fff; font-size:44px; font-weight:bold; margin-bottom:8px; }
#ro .det { color:#aaa; font-size:12px; margin-bottom:16px; }
#ro button {
  padding:10px 28px; background:#ffcc00; color:#000; border:none;
  border-radius:6px; font-size:15px; font-weight:bold; cursor:pointer; font-family:monospace;
}
#ro button:hover, #ro button:active { background:#ffdd33; }
#lh {
  position:absolute; top:52px; left:50%; transform:translateX(-50%);
  color:#aaa; font-size:10px; pointer-events:none;
}
</style>
</head>
<body>
<div id="gc">
  <canvas id="c"></canvas>
  <div id="tui">
    <span id="ri">第1轮 · 目标80</span>
    <span>球:<span id="bs">0</span>/<span id="bt">4</span></span>
    <span id="sd">0</span>
  </div>
  <div id="bui"></div>
  <div id="lh">↓ 拖拽瞄准，松开发射 ↓</div>
  <div id="sel"><h2>抽3选1</h2><div id="sopts"></div></div>
  <div id="upg"><h2>⚒ 盘面改造 (影响第3轮)</h2><div id="uopts"></div></div>
  <div id="ro">
    <h1 id="rt"></h1><div class="scr" id="rsc"></div>
    <div class="det" id="rdet"></div>
    <button id="rbtn" onclick="restartGame()">再来一局</button>
  </div>
</div>

<script>
// ============================================================
// Constants
// ============================================================
const VW=360, VH=640, GR=500, MS=800;
const WALL_B=0.5, GRACE=8, MAX_BALLS=10;
const BALL_COLORS={iron:'#666',crystal:'#ddd',magnet:'#48f',glass:'#4d6'};
const BALL_NAMES={iron:'铁球',crystal:'水晶球',magnet:'磁球',glass:'玻璃球'};
const BALL_DESCS={
  iron:'重·穿透peg',crystal:'轻·高弹跳',
  magnet:'中·偏向奖励',glass:'中·撞6分裂'
};

// Slots
const SLOTS=[
  {x:VW*0.15,y:VH-28,w:56,h:18,pos:'left',eff:'elasticity_boost'},
  {x:VW*0.50,y:VH-28,w:56,h:18,pos:'center',eff:'score_bonus'},
  {x:VW*0.85,y:VH-28,w:56,h:18,pos:'right',eff:'ball_recovery'},
];

// Rounds
const ROUNDS=[
  {target:80,shots:4,bonus:4,danger:4},
  {target:120,shots:5,bonus:4,danger:5},
  {target:160,shots:6,bonus:4,danger:6},
];

// Upgrades
const UPGRADES=[
  {id:'metal',name:'金属镀层',desc:'盘面中部+4个奖励peg(金)',
   apply:(pegs)=>{
    pegs=[...pegs.map(p=>({...p}))];
    for(let i=0;i<4;i++)
      pegs.push({x:VW*(0.25+i*0.17),y:VH*(0.43+(i%2)*0.07),type:'bonus',tags:['bonus','metal'],r:6,alive:true});
    return pegs;
   }},
  {id:'clear',name:'危险清除',desc:'移除所有红色危险peg + 等量灰色peg',
   apply:(pegs)=>{
    pegs=[...pegs.map(p=>({...p}))];
    let danger=pegs.filter(p=>p.type==='danger').length;
    pegs=pegs.filter(p=>p.type!=='danger');
    // Remove equal number of normal pegs
    let normal=pegs.filter(p=>p.type==='normal');
    let remove=Math.min(danger,normal.length);
    for(let i=normal.length-1;i>=0&&remove>0;i--) normal[i].alive=false,remove--;
    return pegs.filter(p=>p.alive);
   }},
];

// ============================================================
// Game State
// ============================================================
let G={
  score:0,round:0,shotsLeft:0,ballBag:[],activeBalls:[],
  currentBall:null,elasticityBonus:0,upgradeChosen:null,
  state:'IDLE', // IDLE|AIMING|FLYING|BALL_SELECT|REWARD_SELECT|UPGRADE_SELECT|GAME_OVER
  mouseDown:false,aimStart:null,aimEnd:null,lastTime:0,
};

// ============================================================
// Peg Generation
// ============================================================
function genPegs(bonusCount,dangerCount){
  let pegs=[];
  let rows=[0.22,0.28,0.34,0.40,0.46,0.52,0.58,0.64];
  let cols=[3,4,3,5,3,4,3,5];
  for(let r=0;r<rows.length;r++){
    let y=VH*rows[r], n=cols[r], off=r%2?0.5:0;
    for(let c=0;c<n;c++){
      let x=VW*(0.1+(c+off)*0.8/(n-1+off*2));
      if(x>VW*0.05&&x<VW*0.95) pegs.push({x,y,type:'normal',tags:['normal'],r:6,alive:true});
    }
  }
  // Assign bonus
  let bonus=new Set();
  while(bonus.size<bonusCount&&bonus.size<pegs.length){
    let i=Math.floor(Math.random()*pegs.length);
    if(pegs[i].type==='normal') bonus.add(i);
  }
  for(let i of bonus){pegs[i].type='bonus';pegs[i].tags=['bonus','metal'];}
  // Assign danger
  let danger=new Set();
  while(danger.size<dangerCount&&danger.size<pegs.length-bonus.size){
    let i=Math.floor(Math.random()*pegs.length);
    if(pegs[i].type==='normal') danger.add(i);
  }
  for(let i of danger){pegs[i].type='danger';pegs[i].tags=['danger'];}
  return pegs;
}

// ============================================================
// Ball Creation
// ============================================================
function mkBall(id,x,y,vx,vy){
  let specs={
    iron:{w:2.0,e:0.3,tags:['heavy','metal'],eff:'pierce',r:10},
    crystal:{w:0.5,e:0.9,tags:['light','crystal'],eff:'none',r:10},
    magnet:{w:1.0,e:0.6,tags:['medium','electric'],eff:'magnet',r:10,mt:'metal',mr:50},
    glass:{w:1.0,e:0.6,tags:['medium','glass','split'],eff:'split',r:10,sp:6},
  }[id];
  return{
    id,x:x||VW/2,y:y||50,vx:vx||0,vy:vy||0,r:specs.r,
    weight:specs.w,elasticity:specs.e,tags:[...specs.tags],
    effect:specs.eff,color:BALL_COLORS[id],
    colCount:0,splitAt:specs.sp||6,magTag:specs.mt||null,magRange:specs.mr||50,
    alive:true,piercing:specs.eff==='pierce',pierced:new Set(),
  };
}

// ============================================================
// Ball Bag
// ============================================================
function initBag(){
  G.ballBag=['iron','iron','crystal','crystal','magnet','glass'].map(id=>({id,used:false}));
}
function drawFromBag(n=3){
  let avail=G.ballBag.filter(b=>!b.used);
  if(avail.length===0){G.ballBag.push({id:'iron',used:false},{id:'iron',used:false});avail=G.ballBag.filter(b=>!b.used);}
  return [...avail].sort(()=>Math.random()-0.5).slice(0,Math.min(n,avail.length));
}
function useBall(id){
  let entry=G.ballBag.find(b=>!b.used&&b.id===id);
  if(entry) entry.used=true;
}
function addToBag(id){G.ballBag.push({id,used:false});}

// ============================================================
// Game Init & Flow
// ============================================================
function initRound(ri){
  G.round=ri;
  let r=ROUNDS[ri];
  G.shotsLeft=r.shots;
  let pegs=genPegs(r.bonus,r.danger);
  if(ri===2&&G.upgradeChosen) pegs=G.upgradeChosen.apply(pegs);
  G.boardPegs=pegs;
  G.activeBalls=[];
  G.currentBall=null;
  G.elasticityBonus=0;
}

function startPreShot(){
  let avail=G.ballBag.filter(b=>!b.used);
  if(avail.length===0){G.ballBag.push({id:'iron',used:false},{id:'iron',used:false});}
  showBallSelect();
}

function showBallSelect(){
  G.state='BALL_SELECT';
  document.getElementById('sel').querySelector('h2').textContent='抽3选1';
  let options=drawFromBag(3);
  let c=document.getElementById('sopts');c.innerHTML='';
  options.forEach(b=>{
    let d=document.createElement('div');d.className='bo';
    d.innerHTML=`<div class="ic" style="background:${BALL_COLORS[b.id]}"></div>
      <div class="nm">${BALL_NAMES[b.id]}</div><div class="ds">${BALL_DESCS[b.id]}</div>`;
    d.onclick=()=>{useBall(b.id);G.currentBall=mkBall(b.id,VW/2,50,0,0);G.state='AIMING';
      hide('sel');show('lh');ui();};
    c.appendChild(d);
  });
  show('sel'); hide('lh');
}

function showRewardSelect(){
  G.state='REWARD_SELECT';
  let rewards=['iron','crystal','glass'];
  let c=document.getElementById('sopts');c.innerHTML='';
  document.getElementById('sel').querySelector('h2').textContent='🎁 获得一颗新球';
  rewards.forEach(id=>{
    let d=document.createElement('div');d.className='bo';
    d.innerHTML=`<div class="ic" style="background:${BALL_COLORS[id]}"></div>
      <div class="nm">${BALL_NAMES[id]}</div><div class="ds">加入球袋</div>`;
    d.onclick=()=>{addToBag(id);hide('sel');ui();initRound(1);startPreShot();};
    c.appendChild(d);
  });
  show('sel'); hide('lh');
}

function showUpgradeSelect(){
  G.state='UPGRADE_SELECT';
  let c=document.getElementById('uopts');c.innerHTML='';
  UPGRADES.forEach(u=>{
    let d=document.createElement('div');d.className='uo';
    d.innerHTML=`<div class="nm">${u.name}</div><div class="ds">${u.desc}</div>`;
    d.onclick=()=>{G.upgradeChosen=u;hide('upg');ui();initRound(2);startPreShot();};
    c.appendChild(d);
  });
  show('upg'); hide('lh');
}

function endRound(passed){
  hide('lh');
  if(passed){
    if(G.round===0){showRewardSelect();}
    else if(G.round===1){showUpgradeSelect();}
    else if(G.round===2){showResult(true);}
  }else{showResult(false);}
}

function showResult(won){
  G.state='GAME_OVER';
  let o=document.getElementById('ro');
  document.getElementById('rt').textContent=won?'🎉 通关！':'💀 未达目标';
  document.getElementById('rsc').textContent=G.score;
  let rd=ROUNDS[G.round];
  document.getElementById('rdet').textContent=won?'3轮全部通过！':
    `未达到 ${rd.target} 分目标 (当前 ${G.score})`;
  document.getElementById('rbtn').textContent='再来一局';
  o.style.display='flex';
}

function restartGame(){
  G.score=0;G.round=0;G.upgradeChosen=null;G.activeBalls=[];G.currentBall=null;
  G.elasticityBonus=0;initBag();
  hide('sel');hide('upg');hide('ro');show('lh');
  initRound(0);startPreShot();G.lastTime=0;
}

function onCheckRoundEnd(){
  if(G.shotsLeft<=0&&G.activeBalls.length===0){
    let passed=G.score>=ROUNDS[G.round].target;
    endRound(passed);
    return true;
  }
  if(G.activeBalls.length===0&&G.shotsLeft>0&&G.state==='FLYING'){
    // Next shot
    startPreShot();
    return true;
  }
  return false;
}

// ============================================================
// Physics
// ============================================================
function collideBallPeg(ball,peg){
  let dx=ball.x-peg.x, dy=ball.y-peg.y, dist=Math.sqrt(dx*dx+dy*dy);
  let minD=ball.r+peg.r;
  if(dist>=minD||dist<0.001) return false;
  // Separate
  let nx=dx/dist, ny=dy/dist, overlap=minD-dist;
  ball.x+=nx*overlap*0.5; ball.y+=ny*overlap*0.5;
  // Relative velocity
  let dvn=ball.vx*nx+ball.vy*ny;
  if(dvn>0) return false; // separating
  // Bounce
  let e=Math.min(ball.elasticity,0.5);
  let j=-(1+e)*dvn;
  ball.vx+=j*nx; ball.vy+=j*ny;
  // Damping
  ball.vx*=0.998; ball.vy*=0.998;
  return true;
}

function collideBallBall(a,b){
  if(!a.alive||!b.alive||a===b) return;
  let dx=b.x-a.x, dy=b.y-a.y, dist=Math.sqrt(dx*dx+dy*dy);
  let minD=a.r+b.r;
  if(dist>=minD||dist<0.001) return;
  let nx=dx/dist, ny=dy/dist, overlap=minD-dist;
  let totalW=a.weight+b.weight;
  a.x-=nx*overlap*(b.weight/totalW); a.y-=ny*overlap*(b.weight/totalW);
  b.x+=nx*overlap*(a.weight/totalW); b.y+=ny*overlap*(a.weight/totalW);
  let dvn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(dvn>0) return;
  let e=Math.min(a.elasticity,b.elasticity);
  let j=-(1+e)*dvn/totalW;
  a.vx-=j*b.weight*nx; a.vy-=j*b.weight*ny;
  b.vx+=j*a.weight*nx; b.vy+=j*a.weight*ny;
}

function updatePhysics(dt){
  dt=Math.min(dt,0.04);
  for(let ball of G.activeBalls){
    if(!ball.alive) continue;
    ball.vy+=GR*dt; // Gravity
    // Magnet effect
    if(ball.magTag){
      let best=null,bestD=ball.magRange;
      for(let peg of G.boardPegs){
        if(!peg.alive||!peg.tags.includes(ball.magTag)) continue;
        let dx=peg.x-ball.x, dy=peg.y-ball.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<bestD){bestD=d;best=peg;}
      }
      if(best){
        let dx=best.x-ball.x, dy=best.y-ball.y, d=Math.sqrt(dx*dx+dy*dy);
        if(d>0.1){ball.vx+=(dx/d)*150*dt; ball.vy+=(dy/d)*150*dt;}
      }
    }
    // Integrate
    ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
    // Speed cap
    let sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    if(sp>MS){ball.vx*=MS/sp;ball.vy*=MS/sp;}
    // Walls
    if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)*WALL_B;ball.wallHits=(ball.wallHits||0)+1;}
    if(ball.x+ball.r>VW){ball.x=VW-ball.r;ball.vx=-Math.abs(ball.vx)*WALL_B;ball.wallHits=(ball.wallHits||0)+1;}
    if(ball.y-ball.r<30){ball.y=30+ball.r;ball.vy=Math.abs(ball.vy)*WALL_B;ball.wallHits=(ball.wallHits||0)+1;}
    // Bottom
    if(ball.y+ball.r>VH){
      let caught=false;
      for(let s of SLOTS){
        if(ball.x>s.x-s.w/2-GRACE&&ball.x<s.x+s.w/2+GRACE&&
           ball.y>s.y-s.h/2-GRACE){
          if(s.eff==='score_bonus') G.score+=10;
          else if(s.eff==='elasticity_boost') G.elasticityBonus=0.1;
          else if(s.eff==='ball_recovery') G.shotsLeft++;
          ball.alive=false; caught=true; break;
        }
      }
      if(!caught) ball.alive=false;
    }
    // Peg collisions
    for(let peg of G.boardPegs){
      if(!peg.alive||!ball.alive) continue;
      let dx=ball.x-peg.x, dy=ball.y-peg.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<ball.r+peg.r){
        if(ball.piercing&&!ball.pierced.has(peg)){
          // Pierce
          ball.pierced.add(peg);
          if(peg.type==='bonus') G.score+=25;
          else if(peg.type==='normal') G.score+=10;
          else if(peg.type==='danger'){G.score=Math.max(0,G.score-5);ball.vx*=0.7;ball.vy*=0.7;}
          if(peg.type!=='danger') peg.alive=false;
          ball.colCount++;
        }else{
          if(collideBallPeg(ball,peg)){
            ball.colCount++;
            if(peg.type==='bonus') G.score+=25;
            else if(peg.type==='normal') G.score+=10;
            else if(peg.type==='danger'){G.score=Math.max(0,G.score-5);ball.vx*=0.8;ball.vy*=0.8;}
            if(peg.type!=='danger') peg.alive=false;
          }
        }
        // Glass split
        if(ball.effect==='split'&&ball.colCount>=ball.splitAt&&ball.r>7){
          splitBall(ball);
        }
      }
    }
    // NOTE: do NOT clear ball.pierced — danger pegs stay alive,
    // we must not re-score the same peg across frames.
    // Ball lifetime timeout (safety: kill if alive > 8s)
    ball.lifetime=(ball.lifetime||0)+dt;
    if(ball.lifetime>6){ball.alive=false;}
    // Recalculate speed after all collisions
    sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    // Kill if drifting in upper half too long
    if(ball.y<VH*0.4&&ball.lifetime>6){ball.alive=false;}
    // Speed floor: if slow and deep, kill
    if(sp<30&&ball.y>VH*0.8&&ball.lifetime>2){ball.alive=false;}
    // Horizontal oscillation detector: too many wall bounces without falling
    ball.wallHits=ball.wallHits||0;
    if(sp>50&&ball.y<VH*0.5&&ball.lifetime>5&&ball.wallHits>8){ball.alive=false;}
  }
  // Ball-ball collisions
  for(let i=0;i<G.activeBalls.length;i++){
    for(let j=i+1;j<G.activeBalls.length;j++){
      collideBallBall(G.activeBalls[i],G.activeBalls[j]);
    }
  }
  // Cleanup
  G.activeBalls=G.activeBalls.filter(b=>b.alive);
  // Cap
  while(G.activeBalls.length>MAX_BALLS){G.activeBalls[0].alive=false;G.activeBalls.shift();}
}

function splitBall(ball){
  let sp=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)*0.8;
  let a=Math.random()*Math.PI*2;
  for(let i=0;i<2;i++){
    let c=mkBall('glass',ball.x,ball.y,Math.cos(a+i*Math.PI)*sp,Math.sin(a+i*Math.PI)*sp);
    c.r=6; c.colCount=0; c.splitAt=999; c.piercing=false; c.effect='none';
    G.activeBalls.push(c);
  }
  ball.alive=false;
}

// ============================================================
// Input
// ============================================================
let cvs=document.getElementById('c');
function getPos(e){
  let r=cvs.getBoundingClientRect();
  let cx=(e.clientX||e.touches[0].clientX)-r.left;
  let cy=(e.clientY||e.touches[0].clientY)-r.top;
  return{x:cx*(VW/r.width),y:cy*(VH/r.height)};
}
cvs.addEventListener('mousedown',e=>{
  if(G.state!=='AIMING') return;
  let p=getPos(e);
  if(p.y<120){G.mouseDown=true;G.aimStart=p;G.aimEnd=p;}
});
cvs.addEventListener('mousemove',e=>{
  if(!G.mouseDown||G.state!=='AIMING') return;
  G.aimEnd=getPos(e);
});
cvs.addEventListener('mouseup',e=>{
  if(!G.mouseDown) return;
  G.mouseDown=false;
  if(G.state!=='AIMING') return;
  launch(G.aimStart,getPos(e));
  G.aimStart=G.aimEnd=null;
});
cvs.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(G.state!=='AIMING') return;
  let p=getPos(e.touches[0]);
  if(p.y<120){G.mouseDown=true;G.aimStart=p;G.aimEnd=p;}
},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!G.mouseDown||G.state!=='AIMING') return;
  G.aimEnd=getPos(e.touches[0]);
},{passive:false});
cvs.addEventListener('touchend',e=>{
  e.preventDefault();
  if(!G.mouseDown) return;
  G.mouseDown=false;
  if(G.state!=='AIMING') return;
  launch(G.aimStart,G.aimEnd);
  G.aimStart=G.aimEnd=null;
},{passive:false});

function launch(from,to){
  if(!G.currentBall||G.shotsLeft<=0) return;
  let b=G.currentBall; G.currentBall=null;
  // Apply elasticity bonus from left slot (affects THIS launch)
  if(G.elasticityBonus>0){b.elasticity=Math.min(0.95,b.elasticity+G.elasticityBonus);G.elasticityBonus=0;}
  let dx=to.x-from.x, dy=to.y-from.y;
  let dist=Math.max(Math.sqrt(dx*dx+dy*dy),10);
  let power=Math.min(dist*3.5,650);
  b.x=VW/2; b.y=50;
  b.vx=(dx/dist)*power;
  b.vy=Math.max((dy/dist)*power*0.6,100); // minimum downward
  G.activeBalls.push(b);
  G.shotsLeft--;
  G.state='FLYING';
  hide('lh'); ui();
}

// ============================================================
// Rendering
// ============================================================
function drawPeg(p){
  if(!p.alive) return;
  let c=document.getElementById('c').getContext('2d');
  c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);
  if(p.type==='normal'){c.fillStyle='#666';c.strokeStyle='#444';}
  else if(p.type==='bonus'){
    c.fillStyle='#fa0';c.strokeStyle='#c80';
    let pl=Math.sin(Date.now()/300)*0.3+0.7;
    c.shadowColor='#fc0';c.shadowBlur=4*pl;
  }else if(p.type==='danger'){c.fillStyle='#c33';c.strokeStyle='#922';}
  c.fill();c.stroke();c.shadowBlur=0;
}
function drawBall(b){
  if(!b.alive) return;
  let c=document.getElementById('c').getContext('2d');
  c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);
  c.fillStyle=b.color;c.fill();c.strokeStyle='#000';c.lineWidth=1;c.stroke();
  if(b.effect==='split'&&b.splitAt<900){
    c.fillStyle='#fff';c.font='8px monospace';c.textAlign='center';
    c.fillText(b.colCount,b.x,b.y+3);
  }
  c.lineWidth=1;
}
function drawSlot(s){
  let c=document.getElementById('c').getContext('2d');
  c.strokeStyle='#555';c.setLineDash([4,4]);
  c.strokeRect(s.x-s.w/2,s.y-s.h/2,s.w,s.h);
  c.setLineDash([]);
  c.fillStyle='#888';c.font='9px monospace';c.textAlign='center';
  let labels={center:'+10分',left:'弹性+',right:'+1球'};
  c.fillText(labels[s.pos],s.x,s.y+4);
}
function drawAim(){
  if(!G.mouseDown||!G.aimStart||!G.aimEnd) return;
  let c=document.getElementById('c').getContext('2d');
  let dx=G.aimEnd.x-G.aimStart.x, dy=G.aimEnd.y-G.aimStart.y;
  let dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<5) return;
  c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=2;c.setLineDash([6,4]);
  c.beginPath();c.moveTo(G.aimStart.x,G.aimStart.y);c.lineTo(G.aimEnd.x,G.aimEnd.y);
  c.stroke();c.setLineDash([]);
  // Arrow
  let a=Math.atan2(dy,dx), hl=8;
  c.fillStyle='rgba(255,255,255,0.5)';
  c.beginPath();c.moveTo(G.aimEnd.x,G.aimEnd.y);
  c.lineTo(G.aimEnd.x-hl*Math.cos(a-0.5),G.aimEnd.y-hl*Math.sin(a-0.5));
  c.lineTo(G.aimEnd.x-hl*Math.cos(a+0.5),G.aimEnd.y-hl*Math.sin(a+0.5));
  c.closePath();c.fill();c.lineWidth=1;
}
function render(){
  let c=document.getElementById('c').getContext('2d');
  c.fillStyle='#111';c.fillRect(0,0,VW,VH);
  // Top line
  c.strokeStyle='#333';c.beginPath();c.moveTo(0,30);c.lineTo(VW,30);c.stroke();
  // Launch zone
  if(G.state==='AIMING'){c.fillStyle='rgba(255,255,255,0.02)';c.fillRect(0,0,VW,120);}
  // Slots
  for(let s of SLOTS) drawSlot(s);
  // Pegs
  for(let p of G.boardPegs) drawPeg(p);
  // Balls
  for(let b of G.activeBalls) drawBall(b);
  // Current ball
  if(G.state==='AIMING'&&G.currentBall&&!G.mouseDown){
    let b=G.currentBall;
    c.beginPath();c.arc(b.x,b.y,b.r,0,Math.PI*2);c.fillStyle=b.color;c.fill();
    c.strokeStyle='#fff';c.stroke();
  }
  drawAim();
}

// ============================================================
// Helpers
// ============================================================
function show(id){document.getElementById(id).style.display='block';}
function hide(id){document.getElementById(id).style.display='none';}
function ui(){
  let r=ROUNDS[G.round];
  document.getElementById('ri').textContent=`第${G.round+1}轮 · 目标${r.target}`;
  document.getElementById('bs').textContent=r.shots-G.shotsLeft;
  document.getElementById('bt').textContent=r.shots;
  document.getElementById('sd').textContent=G.score;
  let avail=G.ballBag.filter(b=>!b.used);
  let bui=document.getElementById('bui');
  bui.innerHTML=`👜 ${avail.length}球 `;
  avail.forEach(b=>{bui.innerHTML+=`<span class="bd" style="background:${BALL_COLORS[b.id]}"></span>`;});
}

// ============================================================
// Game Loop
// ============================================================
function loop(ts){
  if(!G.lastTime) G.lastTime=ts;
  let dt=(ts-G.lastTime)/1000;
  if(dt>0.1) dt=0.1;
  G.lastTime=ts;
  if(G.state==='FLYING'){
    updatePhysics(dt);
    onCheckRoundEnd();
  }
  render();
  requestAnimationFrame(loop);
}

// ============================================================
// Start
// ============================================================
initBag();initRound(0);startPreShot();requestAnimationFrame(loop);
window.restartGame=restartGame;
</script>
